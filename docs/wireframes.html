<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enrollment Queue · Sketch Wireframes</title>
  <style>
    :root { color-scheme: light; --ink: #342d2a; --soft: #6c615b; --paper: #fbf9f4; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: var(--paper); color: var(--ink); font: 16px/1.5 "Segoe Print", "Comic Sans MS", cursive; }
    main { max-width: 1500px; margin: 0 auto; }
    h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2.2rem); }
    p { color: var(--soft); margin: 8px 0 18px; }
    figure { margin: 0; overflow: auto; border: 2px solid var(--ink); border-radius: 12px; background: white; }
    img { display: block; width: 100%; min-width: 900px; height: auto; }
    figcaption { padding: 12px 16px; color: var(--soft); }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Enrollment Queue — Low-fidelity sketch wireframes</h1>
    <p>Sixteen rough screen layouts for the student and parent kiosk, staff queue, public display, and admin console.</p>
    <figure>
      <a href="enrollment-wireframes-figma.svg" aria-label="Open the full-size editable SVG wireframe board">
        <img src="enrollment-wireframes-figma.svg" alt="Hand-sketched low-fidelity wireframes for all enrollment queue screens">
      </a>
      <figcaption>Open the SVG for the full-size vector board, or use it as the source artwork for Figma.</figcaption>
    </figure>
  </main>
</body>
</html>
